name: test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly at 02:00 UTC — catches upstream rdd-workflow changes
    - cron: "0 2 * * *"

jobs:
  test:
    name: bats (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout rdd-workflow-e2e
        uses: actions/checkout@v4

      - name: Install rdd-workflow
        run: ./install_testbed.sh --clone

      - name: Verify install
        run: ./install_testbed.sh --status

      - name: Install OS dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq python3-jsonschema

      - name: Install bats-core 1.10+ (apt ships 1.2 which is too old)
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
          bats --version

      - name: Install openspec CLI (required for archive + change ops)
        run: |
          # Install openspec CLI per https://github.com/insight-hub/openspec
          curl -fsSL https://get.openspec.dev | bash
          # Verify on PATH
          command -v openspec && openspec --version

      - name: Make scripts executable
        run: chmod +x tests/scripts/*.sh install_testbed.sh

      - name: Run bats test suite
        id: bats
        run: |
          set -e
          # RDD_WORKFLOW_REPO defaults to ~/.agents/skills/rdd-workflow
          # Resolve symlink if present (--clone installs to a real dir, not symlink)
          if [ -e "$HOME/.agents/skills/rdd-workflow" ]; then
            RDD_WORKFLOW_REPO=$(readlink -f "$HOME/.agents/skills/rdd-workflow")
            export RDD_WORKFLOW_REPO
            echo "RDD_WORKFLOW_REPO=$RDD_WORKFLOW_REPO"
          fi
          if [ -z "$RDD_WORKFLOW_REPO" ]; then
            echo "❌ RDD_WORKFLOW_REPO not set" >&2
            exit 1
          fi
          echo "Running bats tests against $RDD_WORKFLOW_REPO"
          bats tests/integration/ tests/_lib/

      - name: Regression report
        if: always()
        run: bash tests/scripts/report_regression.sh --no-color

      - name: Archive test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bats-failure-logs
          path: |
            /tmp/*.log
            tests/**/*.log
          if-no-files-found: ignore